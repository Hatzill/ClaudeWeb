<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Startline</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Outfit:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
/* Layout: one full-height stage, search block centred (or top-aligned), tiles below, settings drawer slides from the right. */
:root{
  --bg:#f4f5f8; --surface:#ffffff; --fg:#13151a; --muted:#5a616e; --line:#dadde4;
  --accent:#3b6cf6; --on-accent:#ffffff;
  --font-d:'Space Grotesk',system-ui,sans-serif; --font-b:'Inter',system-ui,sans-serif;
  --fs:16px; --w:640px; --r:16px; --dim:0;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1015;--surface:#171a21;--fg:#eceef3;--muted:#98a0ad;--line:#2a2e38;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1015;--surface:#171a21;--fg:#eceef3;--muted:#98a0ad;--line:#2a2e38;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 var(--fs)/1.5 var(--font-b);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;position:relative;overflow-x:hidden}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none}
body[data-bg="gradient"] #bg{background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 22%,var(--bg)),var(--bg) 70%)}
body[data-bg="aurora"] #bg{background:radial-gradient(60% 50% at 15% 10%,color-mix(in srgb,var(--accent) 30%,transparent),transparent 70%),radial-gradient(50% 45% at 90% 85%,color-mix(in srgb,var(--accent) 18%,transparent),transparent 70%)}
body[data-bg="grid"] #bg{background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:36px 36px;opacity:.55}
body[data-bg="image"] #bg{background-size:cover;background-position:center}
#dim{position:fixed;inset:0;z-index:0;background:#000;opacity:var(--dim);pointer-events:none}
.stage{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;align-items:center;gap:28px;padding-block:72px 48px}
body[data-pos="center"] .stage{justify-content:center;padding-block:48px}
.top{position:fixed;top:env(safe-area-inset-top,0px);right:max(12px,env(safe-area-inset-right,0px));z-index:5;padding:12px 0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gear{display:inline-flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:500;font-size:.875rem}
.gear:hover{border-color:var(--accent)}
.clock{text-align:center}
.clock .t{font:500 clamp(2.6rem,9vw,4.4rem)/1 var(--font-d);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.clock .g{color:var(--muted);margin-top:8px}
.engines{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:var(--w)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.8125rem;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip kbd{font:500 .6875rem var(--font-b);opacity:.65;margin-left:6px}
.search{width:100%;max-width:var(--w);position:relative}
.box{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 6px 6px 18px;box-shadow:0 6px 24px -12px rgba(0,0,0,.35)}
.box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.box input{flex:1;min-width:0;border:0;background:transparent;font-size:1.125rem;padding:12px 0;outline:none}
.go{background:var(--accent);color:var(--on-accent);border:0;border-radius:calc(var(--r) - 6px);padding:12px 20px;font-weight:600;text-decoration:none}
.hint{min-height:1.5em;margin:8px 4px 0;color:var(--muted);font-size:.8125rem;text-align:center}
.sugg{position:absolute;left:0;right:0;top:calc(100% - 22px);z-index:4;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-top:30px;overflow:hidden;box-shadow:0 12px 32px -12px rgba(0,0,0,.4)}
.sugg button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 18px;border-bottom:1px solid var(--line)}
.sugg button:last-child{border-bottom:0}
.sugg button:hover,.sugg button:focus-visible{background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px;width:100%;max-width:min(var(--w),900px)}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);color:var(--fg);text-decoration:none;font-size:.8125rem;min-width:0}
.tile:hover{border-color:var(--accent);transform:translateY(-1px)}
.tile i{font:600 1.1rem var(--font-d);font-style:normal;width:40px;height:40px;border-radius:calc(var(--r) - 4px);display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 16%,var(--surface));color:var(--accent)}
.tile i{overflow:hidden}
.tile i img{width:100%;height:100%;object-fit:contain}
.tile i svg{width:22px;height:22px}
.li .lg{padding:3px 8px;font-size:.75rem;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px}
.tile span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{color:var(--muted);font-size:.75rem;text-align:center;max-width:var(--w)}
@media (prefers-reduced-motion:no-preference){.tile{transition:transform .15s,border-color .15s}.drawer{transition:transform .25s}}
/* drawer */
.drawer{position:fixed;top:0;bottom:0;right:0;z-index:20;width:min(400px,100%);background:var(--surface);border-left:1px solid var(--line);overflow-y:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) 20px;transform:translateX(105%)}
.drawer.open{transform:none}
.drawer h2{font:600 1.25rem var(--font-d);margin:0}
.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sec{border-top:1px solid var(--line);padding:16px 0;display:grid;gap:12px}
.sec h3{margin:0;font:600 .75rem var(--font-b);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:.875rem}
.row>label{flex:1}
.row input[type=range]{width:150px;accent-color:var(--accent)}
.row input[type=color]{width:44px;height:30px;border:1px solid var(--line);border-radius:8px;background:none;padding:2px}
.in,.row select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:0}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:none;border:0;padding:6px 12px;font-size:.8125rem}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.sw{display:flex;gap:6px}
.sw button{width:24px;height:24px;border-radius:50%;border:2px solid var(--surface);outline:1px solid var(--line)}
.btn{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:.8125rem}
.btn:hover{border-color:var(--accent)}
.list{display:grid;gap:6px}
.li{display:flex;gap:8px;align-items:center;font-size:.8125rem;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.li b{font-weight:600}.li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.li button{background:none;border:0;color:var(--muted);font-size:1rem;padding:0 4px}
.add{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.add .in{width:100%}.add .btn{grid-column:1/-1}
textarea.in{width:100%;min-height:90px;font:400 .75rem 'JetBrains Mono',monospace}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:.8125rem;z-index:30}
</style>

<div id="bg"></div><div id="dim"></div>
<div class="top"><button class="gear" id="gear" aria-expanded="false" aria-controls="drawer">Customize</button></div>

<main class="stage">
  <div class="clock" id="clock"><div class="t" id="t"></div><div class="g" id="g"></div></div>
  <div class="engines" id="engines" role="group" aria-label="Search engine"></div>
  <div class="search">
    <form class="box" id="form" autocomplete="off">
      <input id="q" type="text" placeholder="Search, type a web address, or use a shortcut like yt cats" aria-label="Search" autofocus>
      <a class="go" id="go" target="_blank" rel="noopener noreferrer" href="#">Go</a>
    </form>
    <div class="hint" id="hint"></div>
    <div class="sugg" id="sugg" hidden></div>
  </div>
  <nav class="tiles" id="tiles" aria-label="Quick links"></nav>
  <p class="note">Results open in a new tab. Pages here cannot show other sites inside themselves, so this is a launcher with your own engines, shortcuts and look.</p>
</main>

<aside class="drawer" id="drawer" aria-label="Customize" hidden>
  <div class="dh"><h2>Customize</h2><button class="btn" id="close">Done</button></div>

  <section class="sec"><h3>Look</h3>
    <div class="row"><label>Theme</label><div class="seg" id="mode"><button data-v="auto">Auto</button><button data-v="light">Light</button><button data-v="dark">Dark</button></div></div>
    <div class="row"><label for="accent">Accent colour</label><input type="color" id="accent"></div>
    <div class="sw" id="swatches"></div>
    <div class="row"><label for="bgsel">Background</label><select id="bgsel"><option value="plain">Plain</option><option value="gradient">Gradient</option><option value="aurora">Aurora</option><option value="grid">Grid</option><option value="image">Your image</option></select></div>
    <div class="row"><label for="img">Background image</label><input type="file" id="img" accept="image/*" style="max-width:170px;font-size:.75rem"></div>
    <div class="row"><label for="dimr">Darken background</label><input type="range" id="dimr" min="0" max="80"></div>
  </section>

  <section class="sec"><h3>Type and shape</h3>
    <div class="row"><label for="fh">Heading font</label><select id="fh"></select></div>
    <div class="row"><label for="fb">Body font</label><select id="fb"></select></div>
    <div class="row"><label for="fs">Text size</label><input type="range" id="fs" min="13" max="22"></div>
    <div class="row"><label for="rr">Corner roundness</label><input type="range" id="rr" min="0" max="32"></div>
    <div class="row"><label for="ww">Search width</label><input type="range" id="ww" min="360" max="900" step="10"></div>
    <div class="row"><label>Vertical position</label><div class="seg" id="pos"><button data-v="center">Centre</button><button data-v="top">Top</button></div></div>
  </section>

  <section class="sec"><h3>Page</h3>
    <div class="row"><label for="name">Your name</label><input class="in" id="name" style="width:150px" placeholder="Shown in greeting"></div>
    <div class="row"><label for="sc">Show clock and greeting</label><input type="checkbox" id="sc"></div>
    <div class="row"><label for="h24">24-hour clock</label><input type="checkbox" id="h24"></div>
    <div class="row"><label for="sl">Show quick links</label><input type="checkbox" id="sl"></div>
    <div class="row"><label for="hist">Suggest from my searches</label><input type="checkbox" id="hist"></div>
    <div class="row"><label>Search history</label><button class="btn" id="clearhist">Clear</button></div>
  </section>

  <section class="sec"><h3>Search engines</h3>
    <div class="list" id="elist"></div>
    <div class="add"><input class="in" id="en" placeholder="Name"><input class="in" id="ek" placeholder="Shortcut (e.g. yt)"><input class="in" id="eu" placeholder="URL with %s for the query" style="grid-column:1/-1"><button class="btn" id="eadd">Add engine</button></div>
  </section>

  <section class="sec"><h3>Quick links</h3>
    <div class="list" id="llist"></div>
    <div class="add"><input class="in" id="ln" placeholder="Name"><input class="in" id="lu" placeholder="Address"><input class="in" id="li" placeholder="Logo image link (optional)" style="grid-column:1/-1"><label for="lf" style="grid-column:1/-1;font-size:.75rem;color:var(--muted)">Or upload a logo (most reliable)</label><input id="lf" type="file" accept="image/*" style="grid-column:1/-1;font-size:.75rem"><button class="btn" id="ladd">Add link</button></div>
    <input type="file" id="limg" accept="image/*" hidden>
  </section>

  <section class="sec"><h3>Backup</h3>
    <textarea class="in" id="data" aria-label="Settings data" spellcheck="false"></textarea>
    <div class="row"><button class="btn" id="exp">Show my settings</button><button class="btn" id="imp">Load pasted settings</button></div>
    <div class="row"><button class="btn" id="reset">Reset everything</button></div>
  </section>
</aside>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
var KEY='startline.v1', HKEY='startline.hist';
var DEF={mode:'auto',accent:'#3b6cf6',bg:'aurora',dim:0,img:'',fh:'Space Grotesk',fb:'Inter',fs:16,w:640,r:16,pos:'center',showLinks:true,showClock:true,h24:true,name:'',engine:'google',hist:true,
engines:[
{id:'google',name:'Google',key:'g',url:'https://www.google.com/search?q=%s'},
{id:'ddg',name:'DuckDuckGo',key:'d',url:'https://duckduckgo.com/?q=%s'},
{id:'bing',name:'Bing',key:'b',url:'https://www.bing.com/search?q=%s'},
{id:'brave',name:'Brave',key:'br',url:'https://search.brave.com/search?q=%s'},
{id:'images',name:'Images',key:'i',url:'https://www.google.com/search?tbm=isch&q=%s'},
{id:'yt',name:'YouTube',key:'yt',url:'https://www.youtube.com/results?search_query=%s'},
{id:'wiki',name:'Wikipedia',key:'w',url:'https://en.wikipedia.org/w/index.php?search=%s'},
{id:'gh',name:'GitHub',key:'gh',url:'https://github.com/search?q=%s'},
{id:'maps',name:'Maps',key:'m',url:'https://www.google.com/maps/search/%s'}],
links:[{n:'Gmail',u:'https://mail.google.com',ic:'mail'},{n:'YouTube',u:'https://www.youtube.com',ic:'play'},{n:'Maps',u:'https://www.google.com/maps',ic:'pin'},{n:'Wikipedia',u:'https://www.wikipedia.org',ic:'book'},{n:'GitHub',u:'https://github.com',ic:'code'},{n:'Reddit',u:'https://www.reddit.com',ic:'chat'},{n:'Hacker News',u:'https://news.ycombinator.com',ic:'news'},{n:'Claude',u:'https://claude.ai',ic:'spark'}]};
var ICONS={mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',play:'<rect x="3" y="5" width="18" height="14" rx="4"/><path d="m10 9 5 3-5 3z"/>',pin:'<path d="M12 21s7-6.2 7-11a7 7 0 0 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>',book:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/>',code:'<path d="m8 8-4 4 4 4M16 8l4 4-4 4M14 5l-4 14"/>',chat:'<path d="M4 5h16v11H9l-5 4z"/>',news:'<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/>',spark:'<path d="M12 3v5M12 16v5M3 12h5M16 12h5M6 6l3 3M15 15l3 3M18 6l-3 3M9 15l-3 3"/>'};
function fillIcon(i,l){var fb=function(){i.innerHTML=ICONS[l.ic]?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+ICONS[l.ic]+'</svg>':esc((l.n||'?').charAt(0).toUpperCase())};if(l.im&&/^(data:image\/|https:\/\/)/i.test(l.im)){var m=new Image();m.alt='';m.onerror=fb;m.src=l.im;i.appendChild(m)}else fb()}
var S=clone(DEF), H=[];
function clone(o){return JSON.parse(JSON.stringify(o))}
function $(id){return document.getElementById(id)}
function load(){try{var s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)S=Object.assign(clone(DEF),s)}catch(e){}
var IC={Gmail:'mail',YouTube:'play',Maps:'pin',Wikipedia:'book',GitHub:'code',Reddit:'chat','Hacker News':'news',Claude:'spark'};S.links.forEach(function(l){if(!l.ic&&!l.im&&IC[l.n])l.ic=IC[l.n]});try{H=JSON.parse(localStorage.getItem(HKEY)||'[]')}catch(e){H=[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){return false}}
function saveH(){try{localStorage.setItem(HKEY,JSON.stringify(H))}catch(e){}}
function toast(m){var t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true},2600)}
function lum(hex){var n=parseInt(hex.slice(1),16),c=[n>>16&255,n>>8&255,n&255].map(function(v){v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]}
var FONTS=['Inter','Space Grotesk','Outfit','DM Serif Display','Fraunces','JetBrains Mono'];
function apply(){
  var r=document.documentElement,b=document.body;
  if(S.mode==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',S.mode);
  r.style.setProperty('--accent',S.accent);
  r.style.setProperty('--on-accent',lum(S.accent)>.4?'#101216':'#ffffff');
  r.style.setProperty('--font-d',"'"+S.fh+"',system-ui,sans-serif");
  r.style.setProperty('--font-b',"'"+S.fb+"',system-ui,sans-serif");
  r.style.setProperty('--fs',S.fs+'px');r.style.setProperty('--w',S.w+'px');r.style.setProperty('--r',S.r+'px');r.style.setProperty('--dim',S.dim/100);
  var bg=S.bg==='image'&&!S.img?'plain':S.bg;b.setAttribute('data-bg',bg);b.setAttribute('data-pos',S.pos);
  $('bg').style.backgroundImage=bg==='image'?'url("'+S.img+'")':'';
  $('clock').hidden=!S.showClock;$('tiles').hidden=!S.showLinks;
  tick();renderEngines();renderTiles();hint();
}
function tick(){
  var d=new Date(),h=d.getHours(),m=('0'+d.getMinutes()).slice(-2);
  $('t').textContent=S.h24?('0'+h).slice(-2)+':'+m:((h%12)||12)+':'+m+' '+(h<12?'AM':'PM');
  var g=h<5?'Good night':h<12?'Good morning':h<18?'Good afternoon':'Good evening';
  $('g').textContent=g+(S.name?', '+S.name:'');
}
function eng(){return S.engines.find(function(e){return e.id===S.engine})||S.engines[0]}
function renderEngines(){
  var el=$('engines');el.innerHTML='';
  S.engines.forEach(function(e){var b=document.createElement('button');b.type='button';b.className='chip';b.setAttribute('aria-pressed',e.id===eng().id);b.innerHTML=esc(e.name)+(e.key?'<kbd>'+esc(e.key)+'</kbd>':'');b.onclick=function(){S.engine=e.id;save();renderEngines();hint();$('q').focus()};el.appendChild(b)});
}
function renderTiles(){
  var el=$('tiles');el.innerHTML='';
  S.links.forEach(function(l){var a=document.createElement('a');a.className='tile';a.href=l.u;a.target='_blank';a.rel='noopener noreferrer';var i=document.createElement('i');a.appendChild(i);fillIcon(i,l);var s=document.createElement('span');s.textContent=l.n;a.appendChild(s);el.appendChild(a)});
}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function safeUrl(u){u=(u||'').trim();if(!u)return '';if(!/^https?:\/\//i.test(u))u='https://'+u;try{var x=new URL(u);return /^https?:$/.test(x.protocol)?x.href:''}catch(e){return ''}}
function resolve(q){
  q=q.trim();if(!q)return null;
  var m=q.match(/^(\S+)\s+(.+)$/);
  if(m){var e=S.engines.find(function(e){return e.key&&e.key.toLowerCase()===m[1].toLowerCase()});if(e)return{url:e.url.replace('%s',function(){return encodeURIComponent(m[2])}),label:'Search '+e.name+' for "'+m[2]+'"'}}
  if(/^(https?:\/\/)?([\w-]+\.)+[a-z]{2,}(:\d+)?([\/?#]\S*)?$/i.test(q)){var u=safeUrl(q);if(u)return{url:u,label:'Open '+q}}
  var d=eng();return{url:d.url.replace('%s',function(){return encodeURIComponent(q)}),label:'Search '+d.name+' for "'+q+'"'}
}
function hint(){
  var r=resolve($('q').value),go=$('go');
  $('hint').textContent=r?r.label:'Searching with '+eng().name;
  go.href=r?r.url:'#';
}
function submit(){
  var q=$('q').value,r=resolve(q);if(!r)return;
  if(S.hist){H=[q.trim()].concat(H.filter(function(x){return x!==q.trim()})).slice(0,30);saveH()}
  $('go').href=r.url;$('go').click();$('sugg').hidden=true;
}
function suggest(){
  var v=$('q').value.trim().toLowerCase(),box=$('sugg');

  var items=H.filter(function(h){return !v||h.toLowerCase().indexOf(v)>-1}).slice(0,6);
  if(!items.length){box.hidden=true;return}
  box.innerHTML='';items.forEach(function(h){var b=document.createElement('button');b.type='button';b.textContent=h;b.onmousedown=function(e){e.preventDefault()};b.onclick=function(){$('q').value=h;box.hidden=true;hint();$('q').focus()};box.appendChild(b)});
  box.hidden=false;
}

function openD(o){var d=$('drawer');if(o){d.hidden=false;requestAnimationFrame(function(){d.classList.add('open')})}else{d.classList.remove('open');setTimeout(function(){d.hidden=true},260)}$('gear').setAttribute('aria-expanded',o)}

function seg(id,key){var el=$(id);function mark(){el.querySelectorAll('button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.v===S[key])})}mark();el.onclick=function(e){var b=e.target.closest('button');if(!b)return;S[key]=b.dataset.v;save();apply();mark()}}
function bind(id,key,type,after){var el=$(id);el[type==='check'?'checked':'value']=S[key];el.addEventListener(type==='check'?'change':'input',function(){S[key]=type==='check'?el.checked:type==='num'?+el.value:el.value;save();apply();if(after)after()})}
function fillSel(id,key){var s=$(id);FONTS.forEach(function(f){var o=document.createElement('option');o.value=o.textContent=f;s.appendChild(o)});}
function listE(){var el=$('elist');el.innerHTML='';S.engines.forEach(function(e,i){var d=document.createElement('div');d.className='li';d.innerHTML='<b>'+esc(e.name)+'</b><span>'+esc(e.key||'')+' · '+esc(e.url)+'</span><button type="button" aria-label="Remove '+esc(e.name)+'">&times;</button>';d.querySelector('button').onclick=function(){if(S.engines.length<2){toast('Keep at least one engine');return}S.engines.splice(i,1);if(!S.engines.some(function(x){return x.id===S.engine}))S.engine=S.engines[0].id;save();apply();listE()};el.appendChild(d)})}
var pend=-1,newIm='';
function listL(){var el=$('llist');el.innerHTML='';S.links.forEach(function(l,i){var d=document.createElement('div');d.className='li';d.innerHTML='<b>'+esc(l.n)+'</b><span>'+esc(l.u)+'</span><button type="button" class="lg" data-a="up">Logo</button>'+(l.im?'<button type="button" class="lg" data-a="clr">Reset</button>':'')+'<button type="button" data-a="rm" aria-label="Remove '+esc(l.n)+'">&times;</button>';d.onclick=function(e){var a=e.target.closest('button');if(!a)return;var k=a.dataset.a;if(k==='rm'){S.links.splice(i,1)}else if(k==='clr'){delete S.links[i].im}else{pend=i;$('limg').click();return}save();apply();listL()};el.appendChild(d)})}
function toIcon(f,cb){if(!f)return;var fr=new FileReader();fr.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,96/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/png'))};im.onerror=function(){toast('Could not read that image')};im.src=fr.result};fr.readAsDataURL(f)}
$('limg').onchange=function(){var f=this.files[0];this.value='';if(!f||pend<0||!S.links[pend])return;toIcon(f,function(d){S.links[pend].im=d;if(!save())toast('Logo is too big to keep after you leave');apply();listL()})};
$('lf').onchange=function(){var f=this.files[0];if(!f)return;toIcon(f,function(d){newIm=d;toast('Logo ready. Now press Add link')})};
$('eadd').onclick=function(){var n=$('en').value.trim(),k=$('ek').value.trim(),u=$('eu').value.trim();if(!n||u.indexOf('%s')<0||!/^https?:\/\//i.test(u)){toast('Add a name and an https address containing %s');return}S.engines.push({id:'c'+Date.now(),name:n,key:k,url:u});['en','ek','eu'].forEach(function(i){$(i).value=''});save();apply();listE()};
$('ladd').onclick=function(){var n=$('ln').value.trim(),u=safeUrl($('lu').value);if(!n||!u){toast('Add a name and a web address');return}var iu=$('li').value.trim(),im=newIm||(/^https:\/\//i.test(iu)?iu:'');var o={n:n,u:u};if(im)o.im=im;S.links.push(o);newIm='';$('ln').value=$('lu').value=$('li').value='';$('lf').value='';save();apply();listL()};
$('clearhist').onclick=function(){H=[];saveH();toast('Search history cleared')};
$('exp').onclick=function(){var c=clone(S);c.img='';$('data').value=JSON.stringify(c,null,1);$('data').select()};
$('imp').onclick=function(){try{var o=JSON.parse($('data').value);if(!o||typeof o!=='object')throw 0;S=Object.assign(clone(DEF),o);S.links=(S.links||[]).filter(function(l){return l&&safeUrl(l.u)});S.engines=(S.engines||[]).filter(function(e){return e&&e.url&&/^https?:\/\//i.test(e.url)&&e.url.indexOf('%s')>-1});if(!S.engines.length)S.engines=clone(DEF.engines);save();syncUI();apply();toast('Settings loaded')}catch(e){toast('That is not valid settings data')}};
$('reset').onclick=function(){if($('reset').dataset.s!=='1'){$('reset').dataset.s='1';$('reset').textContent='Tap again to confirm';setTimeout(function(){$('reset').dataset.s='';$('reset').textContent='Reset everything'},3000);return}S=clone(DEF);save();syncUI();apply();$('reset').dataset.s='';$('reset').textContent='Reset everything';toast('Back to defaults')};
$('img').onchange=function(){var f=this.files[0];if(!f)return;var fr=new FileReader();fr.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,1600/im.width),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.img=c.toDataURL('image/jpeg',.8);S.bg='image';$('bgsel').value='image';if(!save())toast('Image is too big to keep after you leave; it works until then');apply()};im.src=fr.result};fr.readAsDataURL(f)};
var SW=['#3b6cf6','#e5484d','#f5a524','#17a673','#8e4ec6','#0f172a','#ec4899'];
SW.forEach(function(c){var b=document.createElement('button');b.type='button';b.style.background=c;b.setAttribute('aria-label','Accent '+c);b.onclick=function(){S.accent=c;$('accent').value=c;save();apply()};$('swatches').appendChild(b)});
function syncUI(){
  seg('mode','mode');seg('pos','pos');
  ['fh','fb'].forEach(function(id){var s=$(id);if(!s.options.length)fillSel(id)});
  bind('accent','accent','text');bind('bgsel','bg','text');bind('dimr','dim','num');bind('fh','fh','text');bind('fb','fb','text');bind('fs','fs','num');bind('rr','r','num');bind('ww','w','num');
  bind('name','name','text',tick);bind('sc','showClock','check');bind('h24','h24','check');bind('sl','showLinks','check');bind('hist','hist','check');
  listE();listL();
}
var bound=false;
function init(){load();
  ['fh','fb'].forEach(fillSel);
  /* bind once; syncUI re-reads values on reset/import */
  seg('mode','mode');seg('pos','pos');
  bind('accent','accent','text');bind('bgsel','bg','text');bind('dimr','dim','num');bind('fh','fh','text');bind('fb','fb','text');bind('fs','fs','num');bind('rr','r','num');bind('ww','w','num');
  bind('name','name','text',tick);bind('sc','showClock','check');bind('h24','h24','check');bind('sl','showLinks','check');bind('hist','hist','check');
  listE();listL();apply();setInterval(tick,15000)}
/* syncUI on reset/import only refreshes values */
var _sync=syncUI;syncUI=function(){['accent','bgsel','dimr','fh','fb','fs','rr','ww','name'].forEach(function(id){var k={bgsel:'bg',dimr:'dim',rr:'r',ww:'w'}[id]||id;$(id).value=S[k]});['sc','h24','sl','hist'].forEach(function(id){$(id).checked=S[{sc:'showClock',h24:'h24',sl:'showLinks',hist:'hist'}[id]]});['mode','pos'].forEach(function(id){$(id).querySelectorAll('button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.v===S[id])})});listE();listL()};
init();
})();
